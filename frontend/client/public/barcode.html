<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바코드 관리 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            gap: 0;
            flex-direction: column;
            max-width: 98%;
            margin: 0 auto;
            height: calc(100vh - 20px);
        }

        @media (min-width: 1024px) {
            .container {
                flex-direction: row;
            }
        }

        .resize-handle {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        .resize-handle:hover,
        .resize-handle.active {
            background: #e0e0e0;
        }
        .resize-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 30px;
            background: #ccc;
            border-radius: 2px;
        }
        .resize-handle:hover::after,
        .resize-handle.active::after {
            background: #999;
        }

        .input-section {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-width: 250px;
            flex-shrink: 0;
        }

        .output-section {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-width: 200px;
            flex: 1 1 auto;
        }

        .stats-section {
            min-width: 280px;
            max-width: 800px;
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        h1,
        h2 {
            margin: 0 0 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 6px 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }

        .table-container {
            height: calc(100vh - 440px);
            min-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
            overflow-x: auto;
        }

        button {
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
            margin-top: 8px;
        }

        button:hover {
            background-color: #45a049;
        }

        .delete-btn {
            background-color: #f44336;
            padding: 3px 6px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 8px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }

        .barcode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            border: 1px solid #ddd;
            margin: 0;
        }

        .barcode-cell {
            padding: 0px;
            border: 1px solid #ddd;
            text-align: center;
            height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .barcode-image {
            text-align: center;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0;
            padding: 0;
            overflow: hidden;
        }

        .barcode-value {
            font-family: monospace;
            font-size: 9px;
            word-break: break-all;
            text-align: center;
            margin-top: 0;
        }

        .barcode-container {
            height: calc(100vh - 175px);
            min-height: 350px;
            overflow: hidden;
            border: 1px solid #ddd;
            position: relative;
        }

        .page-info {
            font-size: 14px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-text {
            color: #666;
            margin-bottom: 8px;
            font-size: 13px;
        }

        svg {
            max-width: 100%;
            height: auto;
            transform: scale(1.23, 1);
            /* 바코드 너비 확장(고정값) */
            margin: 0 -2px;
            /* 음수 마진으로 SVG 간격 줄이기 */
        }

        .nav-button {
            background-color: #2196F3;
            padding: 5px 12px;
        }

        .nav-button:hover {
            background-color: #0b7dda;
        }

        .print-button {
            background-color: #ff9800;
        }

        .print-button:hover {
            background-color: #e68a00;
        }

        .search-button {
            background-color: #673AB7;
        }

        .search-button:hover {
            background-color: #5E35B1;
        }

        .control-panel {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        select,
        input {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        label {
            margin-right: 3px;
        }

        .keyboard-instruction {
            color: #666;
            font-size: 11px;
            margin-top: 3px;
        }

        .search-box {
            display: flex;
            align-items: center;
            margin: 8px 0;
            gap: 8px;
        }

        .search-result {
            background-color: #fff59d;
            animation: highlight-pulse 1.5s ease-in-out;
        }

        @keyframes highlight-pulse {

            0%,
            100% {
                background-color: #fff59d;
            }

            50% {
                background-color: #ffeb3b;
            }
        }

        .size-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 5px 0 10px 0;
            padding: 8px;
            background-color: #f9f9f9;
            border-radius: 4px;
            flex-wrap: wrap;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: nowrap;
        }

        .slider-container label {
            white-space: nowrap;
        }

        .slider-container input[type="range"] {
            width: 80px;
            margin: 0 3px;
        }

        .slider-container span {
            min-width: 20px;
            text-align: right;
        }

        .number-input {
            width: 50px;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 12px;
            text-align: center;
        }

        .apply-button {
            background-color: #4CAF50;
            margin-left: auto;
        }

        .barcode-count {
            display: inline-flex;
            align-items: center;
            background-color: #f0f0f0;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            color: #333;
            border: 1px solid #ddd;
        }

        .column-4 {
            grid-template-columns: repeat(4, 1fr);
            margin: 0 -1px;
            /* 음수 마진으로 셀 간격 줄이기 */
        }

        .column-5 {
            grid-template-columns: repeat(5, 1fr);
            margin: 0 -1px;
            /* 음수 마진으로 셀 간격 줄이기 */
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .language-selector {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #language-select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .barcode-container,
            .barcode-container * {
                visibility: visible;
            }

            .barcode-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: auto;
                overflow: visible;
                border: none;
            }

            .stats-section {
                display: none !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>

    // 제품명 → 분류 자동 추출 (엑셀 업로드 전이라도 분류 필터 표시용)
    function autoExtractCategory(productName) {
        const n = productName;
        // 우선순위 높은 품목 키워드 (정확한 제품 유형)
        const typeKeywords = [
            '서랍장', '리빙박스', '수납바스켓', '바스켓', '북트롤리', '트롤리',
            '옷걸이', '행거', '정리함', '수납정리함', '수납박스', '선반',
            '탑백', '트레이', '해피박스', '리빙', '수납함', '보관함',
            '슬림서랍장', '이동식', '틈새', '와이드',
        ];
        for (const kw of typeKeywords) {
            if (n.includes(kw)) {
                // 세부 보정
                if (kw === '바스켓' && n.includes('수납바스켓')) return '수납바스켓';
                if (kw === '트롤리' && n.includes('북트롤리')) return '북트롤리';
                if (kw === '수납박스' || kw === '해피박스' || kw === '리빙박스') return '수납박스';
                if (kw === '정리함' || kw === '수납정리함') return '정리함';
                // 서랍장 계열 통일
                if (kw === '서랍장' || kw === '슬림서랍장') return '서랍장';
                return kw;
            }
        }

        // 브랜드/시리즈명 → 제품 유형 매핑 (서랍장 계열: N단 포함)
        const seriesPatterns = [
            { k: '모던플러스', v: '서랍장' },
            { k: '뉴모던플러스', v: '서랍장' },
            { k: '템바보드', v: '서랍장' },
            { k: '라탄플러스', v: '서랍장' },
            { k: '라탄', v: '서랍장' },
            { k: '코지', v: '서랍장' },
            { k: '카밀라', v: '서랍장' },
            { k: '심플리', v: '서랍장' },
            { k: '세라비', v: '서랍장' },
            { k: '에버', v: '서랍장' },
            { k: '어반', v: '서랍장' },
            { k: '컴포트', v: '서랍장' },
            { k: '베이직', v: '서랍장' },
            { k: '가든', v: '서랍장' },
            { k: '위클리', v: '서랍장' },
            { k: '라노보', v: '서랍장' },
            { k: '맥스', v: '서랍장' },
            { k: '슬라이딩', v: '서랍장' },
        ];
        for (const sp of seriesPatterns) {
            if (n.includes(sp.k)) return sp.v;
        }

        // 'N단' 패턴이 있고 서랍장/바스켓 등 키워드가 없으면 서랍장으로 추정
        const danMatch = n.match(/(\d+)단/);
        if (danMatch) {
            return '서랍장';
        }

        // 기타: 제품 유형 단어 추출 (첫 단어가 브랜드일 가능성 높음 → 두 번째 단어)
        const parts = n.split(/[\s,]+/).filter(p => p && p.length > 0);
        if (parts.length >= 2) {
            // 첫 단어가 흔한 브랜드면 두 번째 단어 반환
            const brands = ['보노하우스', '모던플러스', '뉴모던플러스', '로코스'];
            if (brands.includes(parts[0]) && parts[1].length < 10 && !/^[0-9]+$/.test(parts[1])) {
                return parts[1];
            }
            // Box_ 패턴 처리
            if (parts[0].startsWith('Box_') || parts[0].startsWith('BOX_')) {
                const boxPart = parts[0].replace(/^Box_|^BOX_/, '');
                if (boxPart.includes('해피박스') || boxPart.includes('박스')) return '수납박스';
            }
        }

        // '화이트슬림' 시리즈 → 서랍장
        if (n.includes('화이트슬림') || n.includes('슬림')) return '서랍장';

        // 마지막: 첫 번째 단어 (길이 제한)
        const first = n.split(' ')[0];
        if (first && first.length < 8 && !/^[0-9]+$/.test(first)) return first;
        return '기타';
    }

                },
                vi: {

                    outputTitle: "In mã vạch",

                    // 바코드 크기 조정

                    heightAdjust: "Điều chỉnh chiều cao:",
                    // 검색 및 버튼
                    searchPlaceholder: "Tìm kiếm số vận đơn (VD: 10286453466262)",
                    searchButton: "Tìm kiếm",
                    searchFocus: "Nhập số vận đơn chính xác",
                    processData: "Xử lý dữ liệu",
                    clearAll: "Xóa màn hình",
                    resetHistory: "Xóa lịch sử đã lưu",
                    statsTitle: "Thống kê mã vạch (Toàn bộ lịch sử)",
                    statsBarcode: "Mã vạch",
                    statsCount: "Số lượng",

                    // 테이블 헤더
                    trackingHeader: "Số vận đơn (Trường thứ 4)",
                    barcodeHeader: "Mã vạch (Trường thứ 7)",
                    deleteHeader: "Xóa",
                    deleteButton: "Xóa",

                    // 입력 안내
                    dataInfo: "Dán dữ liệu vào khu vực văn bản bên dưới. Dữ liệu phải được phân cách bằng tab. Trường thứ 4 và thứ 7 sẽ được chuyển đổi thành mã vạch.",
                    dataPastePrompt: "Dán dữ liệu của bạn vào đây...",
                    barcodesGenerated: "Số mã vạch đã tạo:",

                    // 페이지 네비게이션
                    prevButton: "Trước",
                    nextButton: "Tiếp",
                    pageText: "Trang",
                    itemsPerPage: "Số mã vạch:",
                    columnsCount: "Số cột:",
                    printButton: "In",

                    // 키보드 안내
                    keyboardInfo: "Nhấn phím cách để di chuyển đến trang tiếp theo.",

                    // 언어 선택
                    languageLabel: "Ngôn ngữ:"
                }
            };

            // 현재 언어 설정
            let currentLang = 'ko';

            // UI 요소 참조
            const dataInput = document.getElementById('data-input');
            const processBtn = document.getElementById('process-btn');
            const clearBtn = document.getElementById('clear-btn');
            const resetHistoryBtn = document.getElementById('reset-history-btn');
            const statsBody = document.getElementById('stats-body');
            const tableBody = document.getElementById('table-body');
            const barcodeOutput = document.getElementById('barcode-output');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const printBtn = document.getElementById('print-btn');
            const currentPageSpan = document.getElementById('current-page');
            const totalPagesSpan = document.getElementById('total-pages');
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const columnCountSelect = document.getElementById('column-count');
            const languageSelect = document.getElementById('language-select');
            const itemsPerPageSelect = document.getElementById('items-per-page');
            const barcodeCountEl = document.getElementById('barcode-count');

            // 바코드 사이즈 조절 관련 요소
            const barcodeWidthInput = document.getElementById('barcode-width');
            const barcodeHeightInput = document.getElementById('barcode-height');
            const widthValueSpan = document.getElementById('width-value');
            const heightValueSpan = document.getElementById('height-value');

            // 숫자 직접 입력 필드
            const barcodeWidthNumberInput = document.getElementById('barcode-width-input');
            const barcodeHeightNumberInput = document.getElementById('barcode-height-input');

            // 제품 관리 관련 요소
            const productFileInput = document.getElementById('product-file-input');
            const uploadProductBtn = document.getElementById('upload-product-btn');
            const manageProductBtn = document.getElementById('manage-product-btn');
            const productDbStatus = document.getElementById('product-db-status');

            // 통계 관련 요소
            const downloadStatsBtn = document.getElementById('download-stats-btn');
            const downloadDbBtn = document.getElementById('download-db-btn');
            const totalQtyValue = document.getElementById('total-qty-value');
            const statsProductWidthInput = document.getElementById('stats-product-width');
            const colProductName = document.getElementById('col-product-name');

            // 제품 DB (localStorage)
            let productDB = {};
            let productCategory = {}; // {barcode: 분류명 (G열)}

            // 통계 데이터
            let sortedStatsData = []; // 정렬된 통계 데이터 저장용

            // 제품명 컬럼 너비 조절 이벤트
            statsProductWidthInput.addEventListener('input', (e) => {
                const width = e.target.value;
                colProductName.style.width = `${width}px`;
            });

            // 초기 제품 DB 로드
            loadProductDB();
            // 분류 필터를 위해 제품 DB 기반 초기 데이터 생성
            seedStatsFromProductDB();

            function loadProductDB() {
                // 기본 제품 DB로 초기화
                productDB = {};
                if (typeof DEFAULT_PRODUCT_DB !== 'undefined') {
                    Object.assign(productDB, DEFAULT_PRODUCT_DB);
                }

                // localStorage에 저장된 사용자 업로드 데이터 병합 (우선순위 높음)
                const saved = localStorage.getItem('productDB');
                if (saved) {
                    try {
                        const userData = JSON.parse(saved);
                        Object.assign(productDB, userData);
                    } catch (e) {
                        console.error('제품 DB 로드 실패', e);
                    }
                }
                // 분류 정보 로드
                productCategory = {};
                const catSaved = localStorage.getItem('productCategory');
                if (catSaved) {
                    try {
                        productCategory = JSON.parse(catSaved);
                    } catch (e) {
                        console.error('분류 DB 로드 실패', e);
                    }
                }
                // 기본 분류: DEFAULT_PRODUCT_CATEGORY + 제품명 자동 추출
                if (Object.keys(productCategory).length === 0) {
                    // 1순위: CSV 기반 DEFAULT_PRODUCT_CATEGORY
                    if (typeof DEFAULT_PRODUCT_CATEGORY !== 'undefined') {
                        Object.assign(productCategory, DEFAULT_PRODUCT_CATEGORY);
                    }
                    // 2순위: DEFAULT_PRODUCT_CATEGORY에 없는 바코드는 제품명에서 자동 추출
                    for (const [barcode, name] of Object.entries(productDB)) {
                        if (!productCategory[barcode]) {
                            const cat = autoExtractCategory(name);
                            if (cat) productCategory[barcode] = cat;
                        }
                    }
                }
                updateProductStatus();
            }

            // 초기 분류 데이터 생성 (데이터 처리 전에도 분류 목록 표시용)
            function seedStatsFromProductDB() {
                const catMap = {};
                for (const [barcode, cat] of Object.entries(productCategory)) {
                    if (cat && cat !== '-') {
                        if (!catMap[cat]) catMap[cat] = { count: 0, sample: barcode };
                        catMap[cat].count++;
                    }
                }
                sortedStatsData = Object.entries(catMap).map(([cat, info]) => ({
                    barcode: info.sample,
                    productName: productDB[info.sample] || cat,
                    category: cat,
                    count: info.count
                }));
                sortedStatsData.sort((a, b) => b.count - a.count);
            }

            function saveProductDB() {
                localStorage.setItem('productDB', JSON.stringify(productDB));
                localStorage.setItem('productCategory', JSON.stringify(productCategory));
                updateProductStatus();
                updateStatistics(); // 제품 정보가 변경되면 통계도 갱신
            }

            function updateProductStatus() {
                const count = Object.keys(productDB).length;
                productDbStatus.textContent = `${translations[currentLang].productRegistered} ${count}${translations[currentLang].unit}`;
            }

            // 제품 엑셀 업로드 버튼 클릭
            uploadProductBtn.addEventListener('click', () => {
                productFileInput.click();
            });

            // 파일 선택 시 처리
            productFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileName = file.name.toLowerCase();
                const isCSV = fileName.endsWith('.csv');

                if (isCSV) {
                    // CSV 파일 처리 (텍스트 기반)
                    const textReader = new FileReader();
                    textReader.onload = (e) => {
                        const text = e.target.result;
                        const lines = text.split('\n');
                        let successCount = 0;

                        // 헤더 행 제외
                        for (let i = 1; i < lines.length; i++) {
                            const line = lines[i].trim();
                            if (!line) continue;

                            // CSV 파싱 (콤마 구분, 따옴표 처리)
                            const fields = [];
                            let current = '';
                            let inQuotes = false;
                            for (let c = 0; c < line.length; c++) {
                                const ch = line[c];
                                if (ch === '"') {
                                    inQuotes = !inQuotes;
                                } else if (ch === ',' && !inQuotes) {
                                    fields.push(current.trim());
                                    current = '';
                                } else {
                                    current += ch;
                                }
                            }
                            fields.push(current.trim());

                            // 5번째 열(인덱스 4): 바코드, 6번째 열(인덱스 5): 제품명, 7번째 열(인덱스 6): 분류
                            if (fields.length >= 6) {
                                const barcode = fields[4];
                                const productName = fields[5];
                                if (barcode && productName) {
                                    productDB[String(barcode).trim()] = String(productName).trim();
                                    // G열(인덱스 6) 분류 저장
                                    if (fields.length >= 7 && fields[6]) {
                                        productCategory[String(barcode).trim()] = String(fields[6]).trim();
                                    }
                                    successCount++;
                                }
                            }
                        }

                        saveProductDB();
                        alert(`${successCount}개의 제품 정보가 등록/갱신되었습니다.`);
                        productFileInput.value = '';
                    };
                    textReader.readAsText(file, 'UTF-8');
                } else {
                    // Excel 파일 처리 (기존 방식)
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        // 첫 번째 시트 사용
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];

                        // JSON으로 변환 (헤더 포함)
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        if (jsonData.length < 2) {
                            alert('데이터가 없는 파일입니다.');
                            return;
                        }

                        // 데이터 파싱 및 DB 업데이트
                        let successCount = 0;

                        // 헤더 행 제외하고 데이터 처리
                        // 5번째 열(인덱스 4): 바코드
                        // 6번째 열(인덱스 5): 제품명
                        // 7번째 열(인덱스 6): 분류
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (row.length >= 6) {

            function loadHistory() {
                const saved = localStorage.getItem('barcodeHistory');
                if (saved) {
                    try {
                        historyData = JSON.parse(saved);
                        updateStatistics();
                    } catch (e) {
                        console.error('데이터 로드 실패', e);
                        historyData = [];
                    }
                }
            }

            function saveHistory() {
                localStorage.setItem('barcodeHistory', JSON.stringify(historyData));
                updateStatistics();
            }

            function updateStatistics() {
                const stats = {};
                historyData.forEach(item => {
                    if (stats[item.barcode]) {
                        stats[item.barcode]++;
                    } else {
                        stats[item.barcode] = 1;
                    }
                });

                // 데이터 정렬 및 가공
                sortedStatsData = Object.keys(stats).map(barcode => {
                    return {
                        barcode: barcode,
                        productName: productDB[barcode] || '-', // 제품명 매칭
                        category: productCategory[barcode] || '-', // 분류 (G열)
                        count: stats[barcode]
                    };
                });

                // 수량 내림차순 정렬
                sortedStatsData.sort((a, b) => b.count - a.count);

                // 총 수량 계산
                const totalQty = sortedStatsData.reduce((sum, item) => sum + item.count, 0);
                totalQtyValue.textContent = totalQty.toLocaleString();

                // 렌더링
                updateCategoryOptions();
                renderStatsPage();
            }

            // 분류 체크박스 갱신
            function updateCategoryOptions() {
                const selectedCategory = activeCategory;

                categoryCheckboxes.innerHTML = '';

                // 전체 버튼 (항상 상단)
                const allDiv = document.createElement('div');
                allDiv.style.cssText = 'padding: 5px 8px; margin-bottom: 3px; cursor: pointer; border-radius: 4px; background: ' + (!selectedCategory ? '#e3f2fd' : '#f5f5f5') + '; font-weight: bold; font-size: 13px;';
                allDiv.textContent = '📋 전체 보기';
                allDiv.onclick = () => { updateCategorySelection(null); };
                categoryCheckboxes.appendChild(allDiv);

                // 분류 목록 (단일 선택 메뉴)
                const catSet = new Set();
                sortedStatsData.forEach(item => {
                    if (item.category && item.category !== '-') catSet.add(item.category);
                });
                const cats = Array.from(catSet).sort();

                cats.forEach(c => {
                    const itemCount = sortedStatsData.filter(item => item.category === c).length;
                    const div = document.createElement('div');
                    const isSelected = (selectedCategory === c);
                    div.style.cssText = 'padding: 5px 8px; margin-bottom: 1px; cursor: pointer; border-radius: 3px; font-size: 13px; background: ' + (isSelected ? '#e3f2fd' : 'transparent') + '; border-left: ' + (isSelected ? '3px solid #1976D2' : '3px solid transparent') + ';';
                    div.innerHTML = c + ' <span style="color:#888;font-size:11px;">(' + itemCount + ')</span>';
                    div.onclick = (function(cat) {
                        return function() { updateCategorySelection(cat); };
                    })(c);
                    categoryCheckboxes.appendChild(div);
                });

                renderStatsPage();
            }

            // 분류 선택 업데이트 (단일 선택)
            let activeCategory = null;

                activeCategory = cat;

                    categoryPanel.style.display = 'none';

            function renderStatsPage() {

                    : sortedStatsData.filter(item => item.category === activeCategory);

                if (filteredData.length === 0) {
                    statsFilteredInfo.textContent = sortedStatsData.length > 0 ? '일치하는 항목 없음' : '';

                // 필터 적용 시 총 수량도 해당 분류만 표시
                const filteredTotalQty = filteredData.reduce((sum, item) => sum + item.count, 0);
                const allTotalQty = sortedStatsData.reduce((sum, item) => sum + item.count, 0);

                // 필터 정보 표시

                    statsFilteredInfo.textContent = `필터: ${filteredData.length}/${totalAll}개`;

            // 검색 기능
            searchBtn.addEventListener('click', searchTrackingNumber);

            function searchTrackingNumber() {
                const searchTerm = searchInput.value.trim();
                if (!searchTerm) {
                    searchInput.placeholder = '검색할 송장번호를 입력해주세요';
                    return;
                }

                // 검색 전 기존 하이라이트 제거
                const highlightedRows = document.querySelectorAll('.search-result');
                highlightedRows.forEach(row => row.classList.remove('search-result'));

                // 부분 일치 검색도 추가 (정확한 일치 검색이 없을 경우 사용)
                let exactMatchIndex = -1;
                let partialMatchIndex = -1;

                // 데이터에서 송장번호 검색 - 정확한 일치 및 부분 일치 검색
                for (let i = 0; i < barcodeData.length; i++) {
                    const item = barcodeData[i];
                    // 정확한 일치 검색
                    if (item.trackingNo === searchTerm || item.barcode === searchTerm) {
                        exactMatchIndex = i;
                        break;
                    }
                    // 부분 일치 검색 (정확한 일치가 없을 경우 대비)
                    if (partialMatchIndex === -1 &&
                        (item.trackingNo.includes(searchTerm) || item.barcode.includes(searchTerm))) {
                        partialMatchIndex = i;
                    }
                }

                // 정확한 일치가 있으면 그것을 사용, 없으면 부분 일치 사용
                const foundIndex = exactMatchIndex !== -1 ? exactMatchIndex : partialMatchIndex;

                if (foundIndex !== -1) {
                    // 페이지 계산
                    const foundPage = Math.floor(foundIndex / itemsPerPage) + 1;

                    // 해당 페이지로 이동
                    if (currentPage !== foundPage) {
                        currentPage = foundPage;
                        updatePagination();
                        renderBarcodePage();
                    }

                    // 테이블 내에서 해당 항목 하이라이트 (data-index 기반)
                    setTimeout(() => {
                        const tableRows = tableBody.querySelectorAll('tr');
                        const localIndex = foundIndex % itemsPerPage;
                        if (tableRows[localIndex]) {
                            tableRows[localIndex].classList.add('search-result');
                            tableRows[localIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);

                    // 바코드 화면에서 하이라이트
                    setTimeout(() => {
                        const barcodeCells = barcodeOutput.querySelectorAll('.barcode-cell');

                        for (let i = 0; i < barcodeCells.length; i++) {
                            const valueElement = barcodeCells[i].querySelector('.barcode-value');
                            if (valueElement && valueElement.textContent === searchTerm) {
                                barcodeCells[i].classList.add('search-result');
                                barcodeCells[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                                break;
                            }
                        }
                    }, 200);
                }
            }

            // 인쇄 버튼 클릭 이벤트
            printBtn.addEventListener('click', () => {
                window.print();
            });

            // 이전 페이지 버튼 클릭 이벤트
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    updatePagination();
                    renderBarcodePage();
                }
            });

            // 다음 페이지 버튼 클릭 이벤트
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    updatePagination();
                    renderBarcodePage();
                }
            });

            // 스페이스바로 페이지 이동 처리
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault(); // 스크롤 방지
                    if (currentPage < totalPages) {
                        currentPage++;
                    } else {
                        currentPage = 1; // 마지막 페이지에서 처음으로 돌아감
                    }
                    updatePagination();
                    renderBarcodePage();
                }
            });

            // 페이지네이션 업데이트
            function updatePagination() {
                currentPageSpan.textContent = currentPage;
                totalPagesSpan.textContent = totalPages;

                // 버튼 활성화/비활성화
                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = currentPage >= totalPages;
            }

            // 데이터 처리 함수
            processBtn.addEventListener('click', async () => {
                const data = dataInput.value.trim();
                if (!data) {
                    alert('데이터를 입력해주세요.');
                    return;
                }


                // 기존 테이블 데이터 지우기 (화면 갱신용)
                tableBody.innerHTML = '';
                barcodeOutput.innerHTML = '';
                barcodeData = [];

                // 중복 체크용 Set (현재 히스토리 기준)
                const existingTrackingNos = new Set(historyData.map(item => item.trackingNo));
                let duplicateCount = 0;

                // 데이터 행 처리
                let processedRows = 0;
                const lines = data.split('\n');

                // 탭이 없는 경우 처리를 위한 패턴 감지
                let detectFormat = true;
                let positions = {
                    trackingNo: 3, // 기본값: 4번째 필드 (인덱스 3)
                    barcode: 6     // 기본값: 7번째 필드 (인덱스 6)
                };

                // 첫 번째 행 분석해서 패턴 확인
                if (lines.length > 0) {
                    const firstLine = lines[0];
                    if (!firstLine.includes('\t')) {
                        // 탭이 없는 경우 스페이스로 시도해보기
                        const spaceSplit = firstLine.trim().split(/\s+/);
                        if (spaceSplit.length >= 7) {
                            // 스페이스로 구분된 데이터로 간주
                        } else {
                            // 구분자가 명확하지 않은 경우 패턴 매칭 사용
                            detectFormat = false;
                        }
                    }
                }

                lines.forEach(line => {
                    if (!line.trim()) return;

                    let trackingNo, barcode;

                    if (detectFormat) {
                        // 탭으로 데이터 분리 시도
                        let fields = line.split('\t');

                        // 탭으로 분리가 안되거나 필드가 부족하면 스페이스로 분리 시도
                        if (fields.length < 2) {
                            fields = line.trim().split(/\s+/);
                        }

                        // 최소 7개 필드가 있는지 확인 (인덱스 6까지 접근 가능해야 함)
                        // 사용자의 데이터 예시를 보면 필드가 많으므로 4번째(3)와 7번째(6)가 존재하는지 확인
                        if (fields.length >= 7) {
                            // 4번째와 7번째 필드 추출 (인덱스는 0부터 시작하므로 3, 6)
                            trackingNo = fields[positions.trackingNo].trim();
                            barcode = fields[positions.barcode].trim();
                        } else {
                            // 필드 수 부족 시 패턴 매칭 시도
                            const trackingNoMatch = line.match(/\d{10,}/); // 10자리 이상 숫자
                            const barcodeMatch = line.match(/[RC]\d+/); // R 또는 C로 시작하는 숫자

                            if (trackingNoMatch && barcodeMatch) {
                                trackingNo = trackingNoMatch[0];
                                barcode = barcodeMatch[0];
                            }
                        }
                    } else {
                        // 탭이 없는 경우 특정 패턴으로 추출
                        // 송장번호: 10자리 이상 연속된 숫자 (기존 10286 고정 제거)
                        const trackingNoMatch = line.match(/\d{10,}/);
                        // 바코드는 R 또는 C로 시작하는 부분
                        const barcodeMatch = line.match(/[RC]\d+/);

                        if (trackingNoMatch && barcodeMatch) {
                            trackingNo = trackingNoMatch[0];
                            barcode = barcodeMatch[0];
                        } else {
                            console.warn('송장번호 또는 바코드를 찾을 수 없습니다:', line);
                            return;
                        }
                    }

                    // 데이터가 유효한지 확인
                    if (trackingNo && barcode) {
                        // 중복 확인
                        if (existingTrackingNos.has(trackingNo)) {
                            duplicateCount++;
                            return; // 중복이면 건너뜀
                        }

                        const newItem = { trackingNo, barcode, createdAt: new Date().toISOString() };

                        // 현재 화면 데이터에 추가
                        barcodeData.push(newItem);

                        // 히스토리 데이터에 추가
                        historyData.push(newItem);
                        existingTrackingNos.add(trackingNo); // 중복 체크 셋에도 추가

                        // 새로운 행 추가
                        addTableRow(trackingNo, barcode);

                        processedRows++;
                    }
                });

                // 바코드 카운트 업데이트
                barcodeCountEl.textContent = `${translations[currentLang].barcodesGenerated} ${barcodeData.length}`;

                // 총 페이지 수 계산
                totalPages = Math.ceil(barcodeData.length / itemsPerPage);
                if (totalPages === 0) totalPages = 1;

                // 현재 페이지 초기화
                currentPage = 1;

                // 페이지네이션 업데이트
                updatePagination();

                // 저장
                saveHistory();

                // 결과 알림
                if (duplicateCount > 0) {
                    alert(`처리 완료: ${processedRows}건\n중복 제외: ${duplicateCount}건`);
                }

                // 바코드 페이지 렌더링
                renderBarcodePage();
            });

            // 바코드 페이지 렌더링 함수
            function renderBarcodePage() {
                barcodeOutput.innerHTML = '';

                // 바코드 그리드 생성
                const grid = document.createElement('div');
                grid.className = 'barcode-grid';

                // 열 개수에 따라 클래스 추가
                const columnCount = parseInt(columnCountSelect.value);
                if (columnCount === 4) {
                    grid.classList.add('column-4');
                } else if (columnCount === 5) {
                    grid.classList.add('column-5');
                }

                barcodeOutput.appendChild(grid);

                // 현재 페이지에 표시할 데이터 범위 계산
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = Math.min(startIndex + itemsPerPage, barcodeData.length);

                // 현재 페이지의 데이터만 표시
                for (let i = startIndex; i < endIndex; i++) {
                    const { trackingNo, barcode } = barcodeData[i];

                    if (trackingNo) {
                        const trackingCell = document.createElement('div');
                        trackingCell.className = 'barcode-cell';
                        trackingCell.style.padding = `${cellPadding}px ${cellPadding + 2}px`; // 세로/가로 패딩
                        trackingCell.style.height = `${barcodeHeight + 15}px`; // 바코드 높이 + 여백

                        const trackingSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        trackingSvg.id = `tracking-barcode-${i}`;
                        trackingSvg.style.transform = `scale(${barcodeScale}, 1)`; // 고정된 확대 비율 사용

                        const trackingImage = document.createElement('div');
                        trackingImage.className = 'barcode-image';
                        trackingImage.appendChild(trackingSvg);

                        trackingCell.appendChild(trackingImage);

                        // 값은 바코드 아래 작게 표시
                        const trackingValue = document.createElement('div');
                        trackingValue.className = 'barcode-value';
                        trackingValue.textContent = trackingNo;
                        trackingValue.style.marginTop = '0';
                        trackingCell.appendChild(trackingValue);

                        grid.appendChild(trackingCell);

                        // 바코드 생성
                        try {
                            JsBarcode(trackingSvg, trackingNo, {
                                format: "CODE128",
                                lineColor: "#000",
                                width: barcodeWidth,
                                height: barcodeHeight,
                                displayValue: false,
                                margin: 0
                            });
                        } catch (error) {
                            console.error(`송장번호 바코드 생성 오류: ${error.message}`);
                            trackingValue.textContent = `${trackingNo} (오류)`;
                        }
                    }

                    // 바코드 셀 생성 (4열 또는 5열 레이아웃에서는 같은 행에 표시)
                    if (barcode) {
                        const barcodeCell = document.createElement('div');
                        barcodeCell.className = 'barcode-cell';
                        barcodeCell.style.padding = `${cellPadding}px ${cellPadding + 2}px`; // 세로/가로 패딩
                        barcodeCell.style.height = `${barcodeHeight + 15}px`; // 바코드 높이 + 여백

                        const barcodeSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        barcodeSvg.id = `product-barcode-${i}`;
                        barcodeSvg.style.transform = `scale(${barcodeScale}, 1)`; // 고정된 확대 비율 사용

                        const barcodeImage = document.createElement('div');
                        barcodeImage.className = 'barcode-image';
                        barcodeImage.appendChild(barcodeSvg);

                        barcodeCell.appendChild(barcodeImage);

                        // 값은 바코드 아래 작게 표시
                        const barcodeValue = document.createElement('div');
                        barcodeValue.className = 'barcode-value';
                        barcodeValue.textContent = barcode;
                        barcodeValue.style.marginTop = '0';
                        barcodeCell.appendChild(barcodeValue);

                        grid.appendChild(barcodeCell);

                        // 바코드 생성
                        try {
                            JsBarcode(barcodeSvg, barcode, {
                                format: "CODE128",
                                lineColor: "#000",
                                width: barcodeWidth,
                                height: barcodeHeight,
                                displayValue: false,
                                margin: 0
                            });
                        } catch (error) {
                            console.error(`바코드 생성 오류: ${error.message}`);
                            barcodeValue.textContent = `${barcode} (오류)`;
                        }
                    }
                }

                // 부족한 셀 채우기 (그리드를 일정하게 유지하기 위해)
                const cellsPerRow = columnCount;
                const totalCells = (endIndex - startIndex) * 2;
                const remainingCells = (cellsPerRow - (totalCells % cellsPerRow)) % cellsPerRow;
                if (remainingCells < cellsPerRow) {
                    for (let i = 0; i < remainingCells; i++) {
                        const emptyCell = document.createElement('div');
                        emptyCell.className = 'barcode-cell';
                        emptyCell.style.padding = `${cellPadding}px ${cellPadding + 2}px`;
                        emptyCell.style.height = `${barcodeHeight + 15}px`;
                        grid.appendChild(emptyCell);
                    }
                }
            }

            // 테이블에 행 추가 함수
            function addTableRow(trackingNo, barcode) {
                const tr = document.createElement('tr');

                // 송장번호 추가
                const tdTracking = document.createElement('td');
                tdTracking.textContent = trackingNo;
                tdTracking.contentEditable = true;
                tdTracking.dataset.index = tableBody.children.length;
                tdTracking.addEventListener('blur', function () {
                    const index = parseInt(this.dataset.index);
                    barcodeData[index].trackingNo = this.textContent.trim();
                    renderBarcodePage();
                });
                tdTracking.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.blur();
                    }
                });
                tr.appendChild(tdTracking);

                // 바코드 추가
                const tdBarcode = document.createElement('td');
                tdBarcode.textContent = barcode;
                tdBarcode.contentEditable = true;
                tdBarcode.dataset.index = tableBody.children.length;
                tdBarcode.addEventListener('blur', function () {
                    const index = parseInt(this.dataset.index);
                    barcodeData[index].barcode = this.textContent.trim();
                    renderBarcodePage();
                });
                tdBarcode.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        this.blur();
                    }
                });
                tr.appendChild(tdBarcode);

                const deleteCell = document.createElement('td');
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = translations[currentLang].deleteButton;
                deleteBtn.className = 'delete-btn';
                deleteBtn.addEventListener('click', () => {
                    const index = Array.from(tableBody.children).indexOf(tr);
                    const deletedItem = barcodeData[index];
                    tr.remove();

                    // 데이터 배열에서도 삭제
                    barcodeData.splice(index, 1);

                    // 히스토리에서도 동일 항목 제거
                    if (deletedItem) {
                        const historyIndex = historyData.findIndex(
                            h => h.trackingNo === deletedItem.trackingNo && h.barcode === deletedItem.barcode
                        );
                        if (historyIndex !== -1) {
                            historyData.splice(historyIndex, 1);

                    }

                    // 데이터 인덱스 업데이트

                    // 총 페이지 수 재계산
                    totalPages = Math.ceil(barcodeData.length / itemsPerPage);
                    if (totalPages === 0) totalPages = 1;
                    if (currentPage > totalPages) currentPage = totalPages;

                    // 페이지네이션 업데이트
                    updatePagination();

                    // 바코드 페이지 다시 렌더링
                    renderBarcodePage();

            // 저장된 너비 불러오기
            function loadResizeWidths() {
                const savedInput = localStorage.getItem('resizeInputWidth');
                const savedStats = localStorage.getItem('resizeStatsWidth');
                if (savedInput) inputSection.style.width = savedInput + 'px';
                if (savedStats) statsSection.style.width = savedStats + 'px';
            }
            loadResizeWidths();

            let resizeData = null;

            document.querySelectorAll('.resize-handle').forEach(handle => {
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const type = handle.dataset.resize;
                    resizeData = { handle, type, startX: e.clientX };

                    // 현재 너비 저장
                    if (type === 'input-output') {
                        resizeData.inputWidth = inputSection.offsetWidth;
                    } else if (type === 'output-stats') {
                        resizeData.statsWidth = statsSection.offsetWidth;
                    }

                    handle.classList.add('active');
                    document.body.style.cursor = 'col-resize';
                    document.body.style.userSelect = 'none';
                });
            });

            document.addEventListener('mousemove', (e) => {
                if (!resizeData) return;
                const dx = e.clientX - resizeData.startX;

                if (resizeData.type === 'input-output') {
                    const newInput = Math.max(250, resizeData.inputWidth + dx);
                    inputSection.style.width = newInput + 'px';
                    // outputSection은 flex: 1로 자동 채움
                } else if (resizeData.type === 'output-stats') {
                    const newStats = Math.max(280, Math.min(800, resizeData.statsWidth - dx));
                    statsSection.style.width = newStats + 'px';
                    // outputSection은 flex: 1로 자동 채움, stats는 우측 끝 고정
                }
            });

            document.addEventListener('mouseup', () => {
                if (!resizeData) return;
                resizeData.handle.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';

                // 저장
                if (resizeData.type === 'input-output') {
                    localStorage.setItem('resizeInputWidth', inputSection.offsetWidth);
                } else if (resizeData.type === 'output-stats') {
                    localStorage.setItem('resizeStatsWidth', statsSection.offsetWidth);
                }
                resizeData = null;
            });
        });
    </script>
</body>

</html>
